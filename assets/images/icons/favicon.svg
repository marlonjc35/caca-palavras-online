<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0f0f5" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Grid -->
  <g transform="translate(96, 96)">
    <!-- 5x5 grid cells -->
    <rect x="0" y="0" width="320" height="320" rx="24" fill="url(#grid)" opacity="0.15"/>
    <!-- Grid lines -->
    <g stroke="#ffffff" stroke-width="2" opacity="0.3">
      <line x1="64" y1="0" x2="64" y2="320"/>
      <line x1="128" y1="0" x2="128" y2="320"/>
      <line x1="192" y1="0" x2="192" y2="320"/>
      <line x1="256" y1="0" x2="256" y2="320"/>
      <line x1="0" y1="64" x2="320" y2="64"/>
      <line x1="0" y1="128" x2="320" y2="128"/>
      <line x1="0" y1="192" x2="320" y2="192"/>
      <line x1="0" y1="256" x2="320" y2="256"/>
    </g>
    <!-- Letters -->
    <g font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="middle">
      <text x="32" y="44">C</text>
      <text x="96" y="44">A</text>
      <text x="160" y="44">Ç</text>
      <text x="224" y="44">A</text>
      <text x="288" y="44">P</text>
      <text x="32" y="108">A</text>
      <text x="96" y="108">L</text>
      <text x="160" y="108">D</text>
      <text x="224" y="108">R</text>
      <text x="288" y="108">A</text>
      <text x="32" y="172">V</text>
      <text x="96" y="172">E</text>
      <text x="160" y="172">I</text>
      <text x="224" y="172">A</text>
      <text x="288" y="172">S</text>
      <text x="32" y="236">R</text>
      <text x="96" y="236">A</text>
      <text x="160" y="236">N</text>
      <text x="224" y="236">D</text>
      <text x="288" y="236">O</text>
      <text x="32" y="300">O</text>
      <text x="96" y="300">M</text>
      <text x="160" y="300">L</text>
      <text x="224" y="300">I</text>
      <text x="288" y="300">N</text>
    </g>
    <!-- Highlight circles for found words -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="#00b894" stroke-width="3" opacity="0.6"/>
    <circle cx="288" cy="32" r="28" fill="none" stroke="#00b894" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
